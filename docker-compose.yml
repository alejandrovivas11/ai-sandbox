version: '3.9'

services:
  # Backend service - FastAPI application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-sandbox-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: sqlite:///./data/staff.db
      DEBUG: ${DEBUG:-False}
      APP_TITLE: ${APP_TITLE:-AI Sandbox}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend-data:/app/data
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
    networks:
      - ai-sandbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Frontend service - Next.js application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-sandbox-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    networks:
      - ai-sandbox-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  backend-data: {}

networks:
  ai-sandbox-network:
    driver: bridge
